name: Deployment readiness

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:compose.smoke.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Configure Linux host for Redis persistence
        run: |
          sudo install -m 0644 infra/sysctl/99-brain-blitz-redis.conf /etc/sysctl.d/99-brain-blitz-redis.conf
          sudo sysctl -p /etc/sysctl.d/99-brain-blitz-redis.conf
      - name: Generate test-only secrets and validate configuration
        run: |
          python3 scripts/init-env.py
          docker compose config --quiet
      - name: Build applications and check images
        run: docker compose --profile tools --parallel 2 build checks smoke bb-auth-service bb-user-service bb-match-service bb-game-service bb-question-service
      - name: Tests, vet, and both Linux architectures
        run: docker compose --profile tools run --rm checks
      - name: Start infrastructure and applications
        run: |
          docker compose up -d --wait --wait-timeout 300
          test "$(docker compose exec -T bb-redis cat /proc/sys/vm/overcommit_memory)" = 1
      - name: Seed questions and play a two-player game
        run: |
          docker compose --profile tools run --rm seed-demo
          docker compose --profile tools run --rm smoke
      - name: Telegram games with 2, 3, 4, and 15 players
        run: docker compose --profile tools run --rm --no-deps -e BOT_INTEGRATION_FULL_GAME=1 telegram-tests go test -race -v -tags=integration -count=1 -timeout=12m -run TestIntegration_TelegramConversationAndFullGame ./integration/...
      - name: Fifteen-player game with an unanswered player
        run: docker compose --profile tools run --rm --no-deps -e BOT_INTEGRATION_FULL_GAME=1 -e BOT_INTEGRATION_SILENT_PLAYER=1 telegram-tests go test -race -v -tags=integration -count=1 -timeout=6m -run 'TestIntegration_TelegramConversationAndFullGame/15_players$' ./integration/...
      - name: Show failure diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Stop the test deployment
        if: always()
        run: docker compose down
